<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, user-scalable=no"
    >

    <title>Brighton Train Departures</title>

    <style>
        html,
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #000;
        }

        #board {
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100%;
            border: 0;
            margin: 0;
            padding: 0;
        }
    </style>
</head>

<body>

    <iframe
        id="board"
        title="Brighton train departures"
    ></iframe>

    <script>
        const pages = [
            "https://tiger.worldline.global/BRGHTN/ciss;graphic=1",
            "https://tiger.worldline.global/BRGHLRD/ciss;graphic=1"
        ];

        const switchDelay = 20000;

        let currentPage = 0;
        let switchTimer = null;

        const board = document.getElementById("board");

        function showPage(index) {
            board.src = pages[index];
        }

        function switchPage() {
            currentPage = (currentPage + 1) % pages.length;
            showPage(currentPage);
            resetTimer();
        }

        function resetTimer() {
            clearTimeout(switchTimer);
            switchTimer = setTimeout(switchPage, switchDelay);
        }

        const interactionEvents = [
            "touchstart",
            "touchmove",
            "pointerdown",
            "pointermove",
            "wheel",
            "mousedown",
            "keydown"
        ];

        interactionEvents.forEach(function (eventName) {
            document.addEventListener(
                eventName,
                resetTimer,
                true
            );
        });

        showPage(currentPage);
        resetTimer();
    </script>

</body>
</html>
